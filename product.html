<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title data-dtitle>منتج | شركة طرح بلدنا</title>
  <meta name="description" content="تفاصيل المنتج – شركة طرح بلدنا للمحاصيل الزراعية. السعر عند الطلب." />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
  <link rel="stylesheet" href="assets/css/style.css" />
</head>

<body class="pageProduct">

<header class="topbar">
  <div class="wrap topbarIn">
    <a class="brand" href="index.html#products" aria-label="Back">
      <div class="logo" aria-hidden="true"></div>
      <div>
        <div class="brandName" data-i18n="brandName">شركة طرح بلدنا للمحاصيل الزراعية</div>
        <div class="brandSub" data-i18n="brandSub">أبويوسف للتجارة والتصنيع</div>
      </div>
    </a>

    <div class="actions">
      <div class="lang" aria-label="Language switcher">
        <button class="active" data-lang="ar">AR</button>
        <button data-lang="en">EN</button>
        <button data-lang="tr">TR</button>
      </div>

      <button class="pill pillCart" id="openCartBtn" type="button">
        <i class="fa-solid fa-bag-shopping"></i>
        <span data-i18n="cart">السلة</span>
        <span class="cartCount" id="cartCount">0</span>
      </button>

      <a class="pill pillRed" href="https://wa.me/201126773698" target="_blank" rel="noopener">
        <i class="fa-brands fa-whatsapp"></i>
        <span data-i18n="ctaQuote">اطلب عرض سعر</span>
      </a>
    </div>
  </div>
</header>

<section class="section productHero">
  <div class="wrap">
    <a class="backLink" href="index.html#products"><i class="fa-solid fa-arrow-right"></i> <span data-i18n="back">رجوع</span></a>

    <div class="productLayout">
      <div>
        <h1 class="secTitle" id="pTitle">—</h1>
        <p class="secDesc" id="pDesc">—</p>

        <div class="pActions">
          <button class="btn btnPrimary" id="addToCartBtn" type="button">
            <i class="fa-solid fa-plus"></i> <span data-i18n="addToCart">إضافة للسلة</span>
          </button>
          <a class="btn" href="https://wa.me/201126773698" target="_blank" rel="noopener">
            <i class="fa-brands fa-whatsapp"></i> <span data-i18n="ctaQuote">اطلب عرض سعر</span>
          </a>
        </div>

        <div class="badgeRow">
          <span class="price"><i class="fa-solid fa-circle-info"></i><span data-i18n="priceNote">السعر عند الطلب</span></span>
          <span class="price"><i class="fa-solid fa-location-dot"></i><span data-i18n="location">أبورواش – الجيزة – مصر</span></span>
        </div>
      </div>

      <div class="pGallery" id="pGallery"></div>
    </div>
  </div>
</section>

<!-- Cart Drawer + Lightbox (نفس index) -->
<aside class="cartDrawer" id="cartDrawer" aria-hidden="true">
  <div class="cartOverlay" id="cartOverlay"></div>
  <div class="cartPanel" role="dialog" aria-modal="true" aria-label="Cart">
    <div class="cartHead">
      <div class="cartTitle"><i class="fa-solid fa-bag-shopping"></i> <span data-i18n="cart">السلة</span></div>
      <button class="iconBtn" id="closeCartBtn" type="button"><i class="fa-solid fa-xmark"></i></button>
    </div>

    <div class="cartBody">
      <div class="cartItems" id="cartItems"></div>
    </div>

    <div class="cartFoot">
      <div class="cartTotalRow">
        <span data-i18n="total">الإجمالي</span>
        <strong id="cartTotal">0</strong>
      </div>

      <div class="cartActions">
        <button class="btn small" id="clearCartBtn" type="button"><i class="fa-solid fa-trash"></i> <span data-i18n="clearCart">تفريغ السلة</span></button>
        <button class="btn btnPrimary small" id="sendOrderBtn" type="button"><i class="fa-brands fa-whatsapp"></i> <span data-i18n="sendOrder">إرسال الطلب</span></button>
      </div>

      <div class="cartHint" data-i18n="cartHint">إرسال الطلب يتم على واتساب برسالة جاهزة.</div>
    </div>
  </div>
</aside>

<div class="lightbox" id="lightbox" aria-hidden="true">
  <div class="lightOverlay" data-close="1"></div>
  <div class="lightWrap" role="dialog" aria-modal="true">
    <button class="iconBtn lightClose" type="button" data-close="1"><i class="fa-solid fa-xmark"></i></button>
    <button class="iconBtn lightPrev" type="button" id="lightPrev"><i class="fa-solid fa-chevron-left"></i></button>
    <img id="lightImg" alt="preview" />
    <button class="iconBtn lightNext" type="button" id="lightNext"><i class="fa-solid fa-chevron-right"></i></button>
  </div>
</div>

<footer>
  <div class="wrap footIn">
    <div>© <span id="year"></span> <span data-i18n="brandName">شركة طرح بلدنا للمحاصيل الزراعية</span></div>
    <div><span data-i18n="footerNote">تصنيع • تجهيز • توريد • تصدير | السعر عند الطلب</span></div>
  </div>
</footer>

<script src="assets/js/app.js"></script>
</body>
</html>
