<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title id="ptitle">منتج | شركة طرح بلدنا</title>
  <meta name="description" id="pdesc" content="تفاصيل المنتج - شركة طرح بلدنا" />
  <meta name="theme-color" content="#0b0b10" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>

  <link rel="stylesheet" href="assets/css/style.css" />
</head>

<body>
  <header class="topbar">
    <div class="wrap topbarIn">
      <a class="brand" href="index.html#products" aria-label="Back">
        <div class="logo" aria-hidden="true"></div>
        <div class="brandTxt">
          <div class="brandName" data-i18n="brandName">شركة طرح بلدنا للمحاصيل الزراعية</div>
          <div class="brandSub" data-i18n="brandSub">أبويوسف للتجارة والتصنيع</div>
        </div>
      </a>

      <div class="actions">
        <div class="lang" aria-label="Language switcher">
          <button class="active" data-lang="ar">AR</button>
          <button data-lang="en">EN</button>
          <button data-lang="tr">TR</button>
        </div>

        <button class="pill pillRed" id="openCartBtn" type="button">
          <i class="fa-solid fa-bag-shopping"></i>
          <span data-i18n="cart">السلة</span>
          <span class="cartCount" id="cartCount">0</span>
        </button>
      </div>
    </div>
  </header>

  <main class="section">
    <div class="wrap">
      <div class="pHeader">
        <a class="backLink" href="index.html#products"><i class="fa-solid fa-arrow-right"></i><span data-i18n="back">رجوع</span></a>
        <div class="pTitleBox">
          <h1 class="secTitle" id="pName">—</h1>
          <p class="secDesc" id="pSub">—</p>
          <div class="pActions">
            <button class="btn btnPrimary" id="addMainToCart" type="button"><i class="fa-solid fa-cart-plus"></i><span data-i18n="addToCart">إضافة للسلة</span></button>
            <a class="btn" href="https://wa.me/201126773698" target="_blank" rel="noopener"><i class="fa-brands fa-whatsapp"></i><span data-i18n="ctaQuote">اطلب عرض سعر</span></a>
          </div>
        </div>
      </div>

      <div class="pGrid" id="pGrid"></div>
    </div>
  </main>

  <!-- Cart Drawer -->
  <div class="drawerBackdrop" id="drawerBackdrop" hidden></div>
  <aside class="drawer" id="cartDrawer" aria-hidden="true">
    <div class="drawerHead">
      <div class="drawerTitle"><i class="fa-solid fa-bag-shopping"></i><span data-i18n="cart">السلة</span></div>
      <button class="iconBtn" id="closeCartBtn" type="button" aria-label="Close"><i class="fa-solid fa-xmark"></i></button>
    </div>
    <div class="drawerBody" id="cartItems"></div>
    <div class="drawerFoot">
      <div class="drawerTotal"><span data-i18n="total">الإجمالي</span><b id="cartTotal">0</b></div>
      <div class="drawerBtns">
        <button class="btn btnGhost" id="clearCartBtn" type="button"><i class="fa-solid fa-trash"></i><span data-i18n="clearCart">تفريغ السلة</span></button>
        <button class="btn btnPrimary" id="sendOrderBtn" type="button"><i class="fa-brands fa-whatsapp"></i><span data-i18n="sendOrder">إرسال الطلب</span></button>
      </div>
      <div class="drawerHint" data-i18n="cartHint">إرسال الطلب يتم على واتساب برسالة جاهزة.</div>
    </div>
  </aside>

  <!-- Lightbox -->
  <div class="lightbox" id="lightbox" hidden>
    <button class="lbClose" id="lbClose" aria-label="Close"><i class="fa-solid fa-xmark"></i></button>
    <button class="lbNav lbPrev" id="lbPrev" aria-label="Prev"><i class="fa-solid fa-chevron-left"></i></button>
    <img id="lbImg" alt="Preview" />
    <button class="lbNav lbNext" id="lbNext" aria-label="Next"><i class="fa-solid fa-chevron-right"></i></button>
  </div>

  <footer>
    <div class="wrap footIn">
      <div>© <span id="year"></span> <span data-i18n="brandName">شركة طرح بلدنا للمحاصيل الزراعية</span></div>
      <div><span data-i18n="footerNote">تصنيع • تجهيز • توريد • تصدير | السعر عند الطلب</span></div>
    </div>
  </footer>

  <script src="assets/js/app.js"></script>
</body>
</html>
