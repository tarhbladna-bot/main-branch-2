<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>طرح بلدنا 2 | Tarh Baldna</title>

<!-- خط Google -->
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&display=swap" rel="stylesheet">

<style>
  /* عام */
  body {
    font-family: 'Cairo', sans-serif;
    background-color: #FFEB3B; /* أصفر لامع */
    margin: 0;
    padding: 0;
    color: #333;
  }

  header {
    background-color: #FFEB3B;
    padding: 15px;
    text-align: center;
    font-size: 24px;
    font-weight: bold;
    color: #4E342E; /* بني غامق للأيقونات والنص */
  }

  /* الأيقونات */
  .icon {
    color: #4E342E; /* بني غامق / فحمي لامع */
    font-size: 24px;
    margin: 0 5px;
    vertical-align: middle;
  }

  /* أزرار الطلب */
  .btn-order {
    background-color: #4E342E; /* بني غامق */
    color: #FFEB3B; /* نص أصفر لامع */
    border: none;
    padding: 10px 20px;
    cursor: pointer;
    border-radius: 8px;
    font-weight: bold;
  }

  .btn-order:hover {
    opacity: 0.85;
  }

  /* السلة */
  .cart {
    position: fixed;
    top: 20px;
    right: 20px;
    background-color: #4E342E; /* بني غامق */
    color: #FFEB3B;
    padding: 10px;
    border-radius: 50%;
    cursor: pointer;
    font-weight: bold;
  }

  /* المنتجات */
  .product {
    display: inline-block;
    width: 45%;
    margin: 2.5%;
    background-color: #FFF8E1; /* خلفية فاتحة داخل المنتج */
    padding: 10px;
    border-radius: 10px;
    text-align: center;
  }

  .product img {
    max-width: 100%;
    height: auto;
    border-radius: 10px;
  }

  .product-name {
    margin-top: 10px;
    font-weight: bold;
    color: #4E342E;
  }

  .product-price {
    margin-top: 5px;
    color: #4E342E;
  }

  /* روابط التواصل */
  .contact a {
    color: #4E342E;
    margin: 0 10px;
    text-decoration: none;
    font-weight: bold;
  }

  .contact a:hover {
    opacity: 0.7;
  }

  /* footer */
  footer {
    text-align: center;
    padding: 15px;
    background-color: #FFEB3B;
    color: #4E342E;
    font-weight: bold;
  }
</style>
</head>

<body>

<header>
  طرح بلدنا 2
</header>

<section class="products">
  <div class="product">
    <img src="images/peanut-shelled-1.jpg" alt="فول مقشر">
    <div class="product-name">فول مقشر</div>
    <button class="btn-order">اطلب الآن</button>
  </div>

  <div class="product">
    <img src="images/peanut-crushed-1.jpg" alt="فول مجروش">
    <div class="product-name">فول مجروش</div>
    <button class="btn-order">اطلب الآن</button>
  </div>

  <div class="product">
    <img src="images/peanut-halawani-1.jpg" alt="فول حلواني">
    <div class="product-name">فول حلواني</div>
    <button class="btn-order">اطلب الآن</button>
  </div>

  <div class="product">
    <img src="images/peanut-shell-1.jpg" alt="فول بالقشرة">
    <div class="product-name">فول بالقشرة</div>
    <button class="btn-order">اطلب الآن</button>
  </div>
</section>

<!-- سلة -->
<div class="cart">🛒</div>

<!-- روابط التواصل -->
<section class="contact" style="text-align:center; margin-top:20px;">
  <a href="https://wa.me/01020508423" target="_blank" class="icon">واتساب</a>
  <a href="mailto:info@tarhbladna.com" class="icon">ايميل</a>
</section>

<footer>
  © 2026 طرح بلدنا 2
</footer>

</body>
</html>
