<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>طرح بلدنا | Tarh Baldna</title>

<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&display=swap" rel="stylesheet">

<style>
body{
margin:0;
font-family:'Cairo',sans-serif;
background:#0a0a0a;
color:#fff;
}

header{
background:#111;
padding:15px 25px;
border-bottom:2px solid #0d1b2a;
display:flex;
justify-content:space-between;
align-items:center;
position:sticky;
top:0;
z-index:1000;
}
header h1{
margin:0;
padding:6px 12px;
border:2px solid #ff6600;
border-radius:8px;
background:#0d1b2a;
}

.products{
display:flex;
flex-wrap:wrap;
justify-content:center;
gap:25px;
padding:30px;
}

.product{
background:#111;
width:240px;
border-radius:18px;
padding:15px;
text-align:center;
box-shadow:0 6px 20px rgba(13,27,42,.4);
transition:.3s;
}
.product:hover{transform:translateY(-8px) scale(1.04)}

.product img.main-img{
width:100%;
border-radius:12px;
cursor:pointer;
transition:.4s;
}

.product h2{
color:#ff8800;
margin:10px 0 5px;
}

.product button{
background:#0d1b2a;
border:none;
padding:8px 14px;
color:#fff;
border-radius:12px;
cursor:pointer;
font-weight:bold;
}

.product-gallery{
display:flex;
justify-content:center;
gap:6px;
margin-top:10px;
}
.product-gallery img{
width:60px;
height:60px;
border-radius:8px;
object-fit:cover;
cursor:pointer;
border:2px solid transparent;
transition:.3s;
}
.product-gallery img.selected{
border-color:#ff6600;
}
.product-gallery img:hover{
transform:scale(1.1);
}
</style>
</head>

<body>

<header>
<h1>طرح بلدنا</h1>
</header>

<div class="products">

<!-- بقشره -->
<div class="product">
<img class="main-img" src="images/peanut-shell-1.jpg">
<h2>فول سوداني بقشره</h2>
<p>السعر عند الطلب</p>
<button>أضف للسلة</button>
<div class="product-gallery">
<img src="images/peanut-shell-1.jpg" class="selected" onclick="changeMainImage(this)">
<img src="images/peanut-shell-2.jpg" onclick="changeMainImage(this)">
<img src="images/peanut-shell-3.jpg" onclick="changeMainImage(this)">
</div>
</div>

<!-- مقشر -->
<div class="product">
<img class="main-img" src="images/peanut-shelled-1.jpg">
<h2>فول سوداني مقشر</h2>
<p>السعر عند الطلب</p>
<button>أضف للسلة</button>
<div class="product-gallery">
<img src="images/peanut-shelled-1.jpg" class="selected" onclick="changeMainImage(this)">
<img src="images/peanut-shelled-2.jpg" onclick="changeMainImage(this)">
<img src="images/peanut-shelled-3.jpg" onclick="changeMainImage(this)">
</div>
</div>

<!-- مجروش -->
<div class="product">
<img class="main-img" src="images/peanut-crushed-1.jpg">
<h2>فول سوداني مجروش</h2>
<p>السعر عند الطلب</p>
<button>أضف للسلة</button>
<div class="product-gallery">
<img src="images/peanut-crushed-1.jpg" class="selected" onclick="changeMainImage(this)">
<img src="images/peanut-crushed-2.jpg" onclick="changeMainImage(this)">
<img src="images/peanut-crushed-3.jpg" onclick="changeMainImage(this)">
</div>
</div>

<!-- حلواني -->
<div class="product">
<img class="main-img" src="images/peanut-halawani-1.jpg">
<h2>فول سوداني حلواني</h2>
<p>السعر عند الطلب</p>
<button>أضف للسلة</button>
<div class="product-gallery">
<img src="images/peanut-halawani-1.jpg" class="selected" onclick="changeMainImage(this)">
<img src="images/peanut-halawani-2.jpg" onclick="changeMainImage(this)">
<img src="images/peanut-halawani-3.jpg" onclick="changeMainImage(this)">
</div>
</div>

</div>

<script>
function changeMainImage(el){
let product = el.closest('.product');
product.querySelector('.main-img').src = el.src;
product.querySelectorAll('.product-gallery img')
.forEach(img=>img.classList.remove('selected'));
el.classList.add('selected');
}
</script>

</body>
</html>
