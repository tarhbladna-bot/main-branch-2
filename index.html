<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>موقع طرح بلدنا</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #e6f0fa; /* خلفية أزرق فاتح */
            margin: 0;
            padding: 0;
            text-align: center;
        }

        h1 {
            color: #1e3a8a; /* أزرق داكن */
            margin: 30px 0;
        }

        /* حاوية المنتجات */
        .products-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            padding: 20px;
            max-width: 1200px;
            margin: 0 auto;
        }

        /* كل منتج */
        .product {
            border: 1px solid #ccc;
            border-radius: 10px;
            background-color: #fff;
            padding: 10px;
            transition: transform 0.3s, box-shadow 0.3s;
        }

        .product:hover {
            transform: translateY(-5px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }

        .product img {
            width: 100%;
            height: 200px;
            object-fit: cover;
            border-radius: 10px;
        }

        .product p {
            margin: 10px 0 0;
            font-size: 16px;
            color: #1e3a8a;
            font-weight: bold;
        }

        .contact {
            font-size: 14px;
            color: #1e3a8a;
            margin-top: 20px;
        }

        .logo {
            width: 60px;
            height: 60px;
            margin-top: 10px;
        }

        /* تصميم جميل للرقم */
        .contact span {
            display: block;
            margin-top: 5px;
            font-weight: bold;
        }

    </style>
</head>
<body>

    <h1>منتجات طرح بلدنا</h1>
