<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>موقع طرح بلدنا</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #fdf5e6;
            margin: 0;
            padding: 0;
            text-align: center;
        }
        h1 {
            color: #d35400;
            margin: 30px 0;
        }
        .products {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 20px;
            padding: 20px;
        }
        .products img {
            width: 200px;
            height: 200px;
            object-fit: cover;
            border-radius: 10px;
            border: 1px solid #ddd;
            transition: transform 0.3s, box-shadow 0.3s;
        }
        .products img:hover {
            transform: translateY(-5px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }
        .contact {
            font-size: 14px;
            color: #555;
            margin-top: 10px;
        }
        .logo {
            width: 50px;
            height: 50px;
            margin-top: 10px;
        }
    </style>
</head>
<body>

    <h1>منتجات طرح بلدنا</h1>

    <!-- الصور الرئيسية للمنتجات -->
    <div class="products">
      <img src="images/product01.jpg.jpeg" alt="فول سوداني">
      <img src="images/product02.jpg.jpeg" alt="فول سوداني">
      <img src="images/product03.jpg.jpeg" alt="فول سوداني">
      <img src="images/product04.jpg.jpeg" alt="فول سوداني">
      <img src="images/product07.jpg.jpeg" alt="فول سوداني">
      <img src="images/product08.jpg.jpeg" alt="فول سوداني">
      <img src="images/product09.jpg.jpeg" alt="فول سوداني">
      <img src="images/product1.jpg" alt="فول سوداني">
    </div>

    <!-- معلومات التواصل -->
    <div class="contact">
        تواصل: 01126773698
        <br>
        <img class="logo" src="images/logo.png" alt="شعار الشركة">
    </div>

</body>
</html>
