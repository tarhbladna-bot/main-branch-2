<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tarh Baldna 2 | Our Products</title>

<!-- Google Font -->
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&display=swap" rel="stylesheet">

<style>
  /* General */
  body {
    font-family: 'Cairo', sans-serif;
    background-color: #FFEB3B; /* Bright Yellow */
    margin: 0;
    padding: 0;
    color: #333;
  }

  header {
    background-color: #FFEB3B;
    padding: 15px;
    text-align: center;
    font-size: 24px;
    font-weight: bold;
    color: #4E342E; /* Dark Brown for icons/text */
  }

  /* Icons */
  .icon {
    color: #4E342E; /* Dark Brown / Shiny */
    font-size: 24px;
    margin: 0 5px;
    vertical-align: middle;
  }

  /* Order Buttons */
  .btn-order {
    background-color: #4E342E; /* Dark Brown */
    color: #FFEB3B; /* Bright Yellow text */
    border: none;
    padding: 10px 20px;
    cursor: pointer;
    border-radius: 8px;
    font-weight: bold;
  }

  .btn-order:hover {
    opacity: 0.85;
  }

  /* Cart */
  .cart {
    position: fixed;
    top: 20px;
    right: 20px;
    background-color: #4E342E; /* Dark Brown */
    color: #FFEB3B;
    padding: 10px;
    border-radius: 50%;
    cursor: pointer;
    font-weight: bold;
  }

  /* Products */
  .product {
    display: inline-block;
    width: 45%;
    margin: 2.5%;
    background-color: #FFF8E1; /* Light inside product */
    padding: 10px;
    border-radius: 10px;
    text-align: center;
  }

  .product img {
    max-width: 100%;
    height: auto;
    border-radius: 10px;
  }

  .product-name {
    margin-top: 10px;
    font-weight: bold;
    color: #4E342E;
  }

  .product-price {
    margin-top: 5px;
    color: #4E342E;
  }

  /* Contact Links */
  .contact a {
    color: #4E342E;
    margin: 0 10px;
    text-decoration: none;
    font-weight: bold;
  }

  .contact a:hover {
    opacity: 0.7;
  }

  /* Footer */
  footer {
    text-align: center;
    padding: 15px;
    background-color: #FFEB3B;
    color: #4E342E;
    font-weight: bold;
  }
</style>
</head>

<body>

<header>
  Tarh Baldna 2
</header>

<section class="products">
  <div class="product">
    <img src="images/peanut-shelled-1.jpg" alt="Shelled Peanuts">
    <div class="product-name">Shelled Peanuts</div>
    <button class="btn-order">Order Now</button>
  </div>

  <div class="product">
    <img src="images/peanut-crushed-1.jpg" alt="Crushed Peanuts">
    <div class="product-name">Crushed Peanuts</div>
    <button class="btn-order">Order Now</button>
  </div>

  <div class="product">
    <img src="images/peanut-halawani-1.jpg" alt="Halawani Peanuts">
    <div class="product-name">Halawani Peanuts</div>
    <button class="btn-order">Order Now</button>
  </div>

  <div class="product">
    <img src="images/peanut-shell-1.jpg" alt="Peanuts with Shell">
    <div class="product-name">Peanuts with Shell</div>
    <button class="btn-order">Order Now</button>
  </div>
</section>

<!-- Cart -->
<div class="cart">🛒</div>

<!-- Contact Links -->
<section class="contact" style="text-align:center; margin-top:20px;">
  <a href="https://wa.me/01020508423" target="_blank" class="icon">WhatsApp</a>
  <a href="mailto:info@tarhbladna.com" class="icon">Email</a>
</section>

<footer>
  © 2026 Tarh Baldna 2
</footer>

</body>
</html>
