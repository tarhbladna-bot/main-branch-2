body{margin:0;font-family:'Cairo',sans-serif;background:#0a0a0a;color:#fff;}

header{
background:#111;

display:flex;
justify-content:space-between;
align-items:center;

.icon-item{

align-items:center;

font-size:12px;
cursor:pointer;
}

.icon-circle{
width:46px;height:46px;
background:#0d1b2a;
border-radius:50%;
display:flex;
align-items:center;
justify-content:center;
font-size:20px;
box-shadow:0 6px 15px rgba(13,27,42,.6);

}

.icon-item:hover .icon-circle{

}

.icon-label{margin-top:6px;}
.icon-item:hover .icon-label{color:#ff6600;}

/* ===== 3 dots ===== */
.menu-wrapper{position:relative;}
.menu-btn{
width:46px;height:46px;
border-radius:50%;
background:#0d1b2a;
display:flex;
align-items:center;
justify-content:center;
font-size:22px;
cursor:pointer;
box-shadow:0 6px 15px rgba(13,27,42,.6);
}
.menu-btn:hover{background:linear-gradient(135deg,#0d1b2a,#ff6600);}

.dropdown{
position:absolute;
top:55px;
right:0;
background:#111;
border:1px solid #0d1b2a;
border-radius:12px;
width:180px;
display:none;
flex-direction:column;
z-index:2000;
}

.dropdown a{
padding:12px 15px;
text-decoration:none;
color:#fff;
font-size:14px;
border-bottom:1px solid #222;
}
.dropdown a:hover{background:#0d1b2a;color:#ff6600;}
.dropdown a:last-child{border-bottom:none;}

.lang-toggle{position:fixed;top:20px;right:90px;padding:10px 15px;background:#0d1b2a;border-radius:10px;cursor:pointer;z-index:999;}

.products{display:flex;flex-wrap:wrap;justify-content:center;gap:25px;padding:30px;}
.product{background:#111;width:260px;border-radius:18px;padding:15px;text-align:center;box-shadow:0 6px 20px rgba(13,27,42,.4);}
.product img.main-img{width:100%;border-radius:12px;cursor:pointer;}
.product h2{color:#ff8800;margin:10px 0 5px}

.controls{display:flex;gap:6px;justify-content:center;margin:8px 0;}
.controls input{width:45%;padding:6px;border-radius:8px;border:none;text-align:center;}

.product-gallery{display:flex;justify-content:center;gap:6px;margin-top:8px;}
.product-gallery img{width:55px;height:55px;border-radius:8px;cursor:pointer;border:2px solid transparent;}
.product-gallery img.selected{border-color:#ff6600;}

.cart{position:fixed;left:20px;top:80px;width:280px;background:#111;border-radius:15px;padding:15px;z-index:999;}
.cart ul{padding:0;list-style:none}
.cart li{background:#222;margin-bottom:6px;padding:6px;border-radius:8px;font-size:13px;}
.cart button{width:100%;margin-top:6px;padding:8px;border:none;border-radius:10px;background:#0d1b2a;color:#fff;cursor:pointer;}

.lightbox{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.9);display:none;justify-content:center;align-items:center;z-index:3000;}
.lightbox img{max-width:90%;max-height:90%;border-radius:15px;}

.footer-icons{display:flex;justify-content:center;gap:25px;margin-top:30px;padding:20px;border-top:2px solid #0d1b2a;flex-wrap:wrap;}
.footer-item{text-align:center;font-size:14px;}
.footer-item p{margin:4px 0;}

<script>
let cart=[];
let currentLang='ar';

function toggleMenu(){
let m=document.getElementById('dropdownMenu');
m.style.display=(m.style.display==='flex')?'none':'flex';
}
document.addEventListener('click',e=>{
if(!e.target.closest('.menu-wrapper')){
document.getElementById('dropdownMenu').style.display='none';
}
});

function add(btn,name){
let p=btn.closest('.product');
let qty=p.querySelector('input').value||'غير محدد';
let price=p.querySelectorAll('input')[1].value||'حسب الاتفاق';
let img=p.querySelector('.main-img').src;
cart.push({name,qty,price,img});
renderCart();
}
function renderCart(){
let ul=document.getElementById('items');ul.innerHTML='';
cart.forEach(i=>{
ul.innerHTML+=`<li>${i.name}<br>كمية: ${i.qty}<br>سعر: ${i.price}</li>`;
});
}
function clearCart(){cart=[];renderCart();}
function send(){
if(!cart.length){alert('السلة فارغة');return;}
let msg='طلب جديد من موقع طرح بلدنا\n\n';
cart.forEach((i,n)=>msg+=`${n+1}) ${i.name}\nكمية:${i.qty}\nسعر:${i.price}\n${i.img}\n\n`);
window.open('https://wa.me/201126773698?text='+encodeURIComponent(msg),'_blank');
}
function changeMainImage(el){
let p=el.closest('.product');
p.querySelector('.main-img').src=el.src;
p.querySelectorAll('.product-gallery img').forEach(i=>i.classList.remove('selected'));
el.classList.add('selected');
}
function openLightbox(el){
document.getElementById('lightbox-img').src=el.src;
document.getElementById('lightbox').style.display='flex';
}
function closeLightbox(){
document.getElementById('lightbox').style.display='none';
}
function toggleCart(){document.getElementById('cart').classList.toggle('active');}
function openAbout(){
alert("شركة طرح بلدنا\nخبرة وجودة في بيع الفول السوداني بأنواعه\n01020508423 / 01126773698");
}
function toggleLang(){}
</script>
