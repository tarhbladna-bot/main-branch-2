<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{margin:0;font-family:'Cairo',sans-serif;background:#0a0a0a;color:#fff;}
header{background:#111;padding:15px 25px;border-bottom:2px solid #0d1b2a;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:1000;}
header h1{color:#fff;margin:0;padding:6px 12px;border:2px solid #ff6600;border-radius:8px;background:#0d1b2a;}
.header-icons{display:flex;gap:18px;align-items:center;}
.icon-item{display:flex;flex-direction:column;align-items:center;text-decoration:none;color:#fff;font-size:12px;position:relative;}
.icon-circle{width:46px;height:46px;background:#0d1b2a;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:20px;color:#fff;box-shadow:0 6px 15px rgba(13,27,42,.6);transition:transform .3s, background .3s;}
.icon-item:hover .icon-circle{background:linear-gradient(135deg,#0d1b2a,#ff6600);color:#fff;transform:translateY(-2px) scale(1.15);}
.icon-label{margin-top:6px;transition:.3s;}
.icon-item:hover .icon-label{color:#ff6600;}
.lang-toggle{position:fixed;top:20px;right:90px;padding:10px 15px;background:#0d1b2a;border-radius:10px;cursor:pointer;z-index:999;}
.lang-toggle:hover{background:linear-gradient(135deg,#0d1b2a,#ff6600);}
.products{display:flex;flex-wrap:wrap;justify-content:center;gap:25px;padding:30px;}
.product{background:#111;width:260px;border-radius:18px;padding:15px;text-align:center;box-shadow:0 6px 20px rgba(13,27,42,.4);}
.product img.main-img{width:100%;border-radius:12px;cursor:pointer;transition:opacity .3s;}
.product h2{color:#ff8800;margin:10px 0 5px}
.controls{display:flex;gap:6px;justify-content:center;margin:8px 0;}
.controls input{width:45%;padding:6px;border-radius:8px;border:none;text-align:center;}
.product-gallery{display:flex;justify-content:center;gap:6px;margin-top:8px;}
.product-gallery img{width:55px;height:55px;border-radius:8px;cursor:pointer;border:2px solid transparent;}
.product-gallery img.selected{border-color:#ff6600;}
.cart{position:fixed;left:20px;top:80px;width:280px;background:#111;border-radius:15px;padding:15px;z-index:999;display:none;}
.cart.active{display:block;}
.cart ul{padding:0;list-style:none}
.cart li{background:#222;margin-bottom:6px;padding:6px;border-radius:8px;font-size:13px;}
.cart button{width:100%;margin-top:6px;padding:8px;border:none;border-radius:10px;background:#0d1b2a;color:#fff;cursor:pointer;}
.lightbox{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.9);display:none;justify-content:center;align-items:center;z-index:3000;}
.lightbox img{max-width:90%;max-height:90%;border-radius:15px;}
.footer-links{position:fixed;bottom:20px;right:20px;display:flex;flex-direction:column;gap:12px;z-index:999;}
.footer-links a{display:flex;align-items:center;justify-content:center;width:50px;height:50px;border-radius:50%;background:#0d1b2a;color:#fff;font-size:22px;text-decoration:none;box-shadow:0 4px 12px rgba(0,0,0,.5);transition:.3s;}
.footer-links a:hover{background:linear-gradient(135deg,#0d1b2a,#ff6600);}
.dropdown{position:relative;}
.dropdown-content{display:none;position:absolute;top:60px;right:0;background:#111;border:2px solid #ff6600;border-radius:10px;flex-direction:column;min-width:160px;z-index:2000;}
.dropdown-content a{color:#fff;padding:10px 15px;text-decoration:none;display:block;border-bottom:1px solid #0d1b2a;}
.dropdown-content a:last-child{border-bottom:none;}
.dropdown-content a:hover{background:#0d1b2a;color:#ff6600;}
.dropdown.show .dropdown-content{display:flex;flex-direction:column;}
@media(max-width:600px){.products{flex-direction:column;align-items:center;}.header-icons{gap:10px;}.dropdown-content{right:10px;}}
</style>
</head>
<body>

<header>
<h1>طرح بلدنا</h1>
<div class="header-icons">
<a class="icon-item" href="javascript:void(0)" onclick="toggleCart()">
<div class="icon-circle">🛒</div><div class="icon-label">السلة</div>
</a>
<a class="icon-item" href="#products">
<div class="icon-circle">📦</div><div class="icon-label">المنتجات</div>
</a>
<div class="icon-item dropdown">

<div class="icon-label">خيارات</div>
<div class="dropdown-content">

<a href="javascript:void(0)" onclick="openAbout()">عن الشركة</a>
<a href="#help">المساعدة</a>
<a href="#question">عندك سؤال؟</a>
</div>
</div>
<a class="icon-item" href="mailto:tarhbladna@gmail.com">
<div class="icon-circle">✉</div><div class="icon-label">الإيميل</div>
</a>
<a class="icon-item" href="https://wa.me/201126773698" target="_blank">
<div class="icon-circle">📞</div><div class="icon-label">واتساب</div>
</a>
</div>
</header>

<div class="lang-toggle" onclick="toggleLang()">English</div>

<div class="products" id="products">

<!-- فول سوداني بقشره -->
<div class="product" data-msg-ar="مناسب للتحميص والتجارة" data-msg-en="Ideal for roasting & trading" data-name-ar="فول سوداني بقشره" data-name-en="Peanut In Shell">
<img class="main-img" src="images/peanut-shell-1.jpg" onclick="openLightbox(this)">

</div>

<!-- فول سوداني مقشر -->
<div class="product" data-msg-ar="جاهز للتعبئة والتصدير" data-msg-en="Ready for packing & export" data-name-ar="فول سوداني مقشر" data-name-en="Shelled Peanut">
<img class="main-img" src="images/peanut-shelled-1.jpg" onclick="openLightbox(this)">

<div class="product" data-msg-ar="مناسب للتحميص والتجارة" data-msg-en="Ideal for crushing & trading" data-name-ar="فول سوداني مجروش" data-name-en="Crushed Peanut">
<img class="main-img" src="images/peanut-crushed-1.jpg" onclick="openLightbox(this)">

<input type="number" placeholder="سعر">
</div>

<div class="product-gallery">
<img src="images/peanut-crushed-1.jpg" class="selected" onclick="changeMainImage(this)">
<img src="images/peanut-crushed-2.jpg" onclick="changeMainImage(this)">

<div class="product" data-msg-ar="للاستهلاك الفوري والحلويات" data-msg-en="For immediate consumption & sweets" data-name-ar="فول سوداني حلواني" data-name-en="Halawani Peanut">
<img class="main-img" src="images/peanut-halawani-1.jpg" onclick="openLightbox(this)">

<div class="controls">
<input type="number" placeholder="كمية" min="1">
<input type="number" placeholder="سعر">
</div>
<button onclick="add(this,'Halawani Peanut')">أضف للسلة</button>
<div class="product-gallery">

<ul id="items"></ul>

</div>

<a href="https://wa.me/201126773698" target="_blank" title="WhatsApp">📞</a>
<a href="https://www.instagram.com/efyos820?igsh=MXhxam40dGpweW12ag==" target="_blank" title="Instagram">📷</a>
<a href="mailto:tarhbladna@gmail.com" title="Email">✉</a>
<a href="javascript:void(0)" onclick="exportCart()" title="Export">⏏️</a>
</div>

<script>
let cart=[];
let currentLang='ar';

function add(btn,name){
let product = btn.closest('.product');
let qty = product.querySelector('input[type=number]').value;
let price = product.querySelectorAll('input')[1].value;
if(!qty){qty='غير محدد';}
if(!price){price='حسب الاتفاق';}
let img = product.querySelector('.main-img').src;
let msgAr = product.dataset.msgAr;
let msgEn = product.dataset.msgEn;
cart.push({name,qty,price,img,msgAr,msgEn});
renderCart();
}

function renderCart(){
let ul=document.getElementById('items');
ul.innerHTML='';
cart.forEach(i=>{
let li=document.createElement('li');
li.innerHTML=`${i.name}<br>كمية: ${i.qty}<br>سعر: ${i.price}`;
ul.appendChild(li);
});
}

function clearCart(){cart=[];renderCart();}

function send(){
if(cart.length===0){alert('السلة فارغة');return;}
let msg=`طلب جديد من موقع طرح بلدنا\n\n`;
cart.forEach((i,n)=>{
msg+=`${n+1}) ${i.name}\nالكمية: ${i.qty}\nالسعر: ${i.price}\nملاحظة: ${i.msgAr}\nImage: ${i.img}\n\nEN:\n${i.name}\nQty: ${i.qty}\nPrice: ${i.price}\n${i.msgEn}\n\n`;
});
window.open('https://wa.me/201126773698?text='+encodeURIComponent(msg),'_blank');
}

function exportCart(){
if(cart.length===0){alert('السلة فارغة');return;}
let data='اسم المنتج,كمية,سعر\n';
cart.forEach(i=>{data+=`${i.name},${i.qty},${i.price}\n`;});
let blob=new Blob([data],{type:'text/csv'});
let url=URL.createObjectURL(blob);
let a=document.createElement('a');
a.href=url;a.download='cart.csv';a.click();URL.revokeObjectURL(url);
}

function changeMainImage(el){
let p=el.closest('.product');
let main=p.querySelector('.main-img');
main.style.opacity=0;
setTimeout(()=>{main.src=el.src;main.style.opacity=1;},200);
p.querySelectorAll('.product-gallery img').forEach(i=>i.classList.remove('selected'));
el.classList.add('selected');
}

function openLightbox(el){
document.getElementById('lightbox-img').src=el.src;
document.getElementById('lightbox').style.display='flex';
}
function closeLightbox(){
document.getElementById('lightbox').style.display='none';
}

function toggleLang(){
let ar = document.querySelectorAll('.ft-ar, .prod-name');
let en = document.querySelectorAll('.ft-en');
if(currentLang==='ar'){
ar.forEach(e=>e.style.display='none');
en.forEach(e=>e.style.display='block');
document.querySelector('.lang-toggle').textContent='عربي';
currentLang='en';
}else{
ar.forEach(e=>e.style.display='block');
en.forEach(e=>e.style.display='none');
document.querySelector('.lang-toggle').textContent='English';
currentLang='ar';
}
document.querySelectorAll('.product').forEach(p=>{
p.querySelector('.prod-name').textContent=currentLang==='en'?p.dataset.nameEn:p.dataset.nameAr;
});
}

function toggleCart(){document.getElementById('cart').classList.toggle('active');}
function openAbout(){alert("شركة طرح بلدنا\nخبرة وجودة في بيع الفول السوداني بأنواعه\nللتواصل: 01020508423 / 01126773698");}
function toggleDropdown(){document.querySelector('.dropdown').classList.toggle('show');}
window.onclick = function(e){if(!e.target.closest('.dropdown')){document.querySelector('.dropdown').classList.remove('show');}}
</script>

</body>
