    font-family: 'Cairo', sans-serif;
    background-color: #E3F2FD; /* أزرق فاتح */
    margin: 0;
    padding: 0;
    color: #1565C0; /* أزرق داكن للنصوص */
  }

  header {
    background-color: #E3F2FD;
    padding: 15px;
    text-align: center;
    font-size: 24px;
    font-weight: bold;
    color: #1565C0; /* أزرق داكن */
  }

  .icon {
    color: #1565C0;
    font-size: 24px;
    margin: 0 5px;

  }

    background-color: #2196F3; /* أزرق متوسط */

    padding: 10px 20px;
    cursor: pointer;
    border-radius: 8px;

  }

  .btn-order:hover {

  }

  .cart {
    position: fixed;
    top: 20px;
    right: 20px;
    background-color: #2196F3;
    color: #FFFFFF;
    padding: 10px;
    border-radius: 50%;
    cursor: pointer;
    font-weight: bold;
  }

  .product {
    display: inline-block;
    width: 45%;
    margin: 2.5%;
    background-color: #FFFFFF; /* خلفية المنتج */
    padding: 10px;
    border-radius: 10px;
    text-align: center;
  }

  .product img {
    max-width: 100%;
    height: auto;
    border-radius: 10px;
  }

  .product-name {
    margin-top: 10px;
    font-weight: bold;
    color: #1565C0;
  }

  .contact a {
    color: #1565C0;
    margin: 0 10px;
    text-decoration: none;
    font-weight: bold;
  }

  .contact a:hover {
    opacity: 0.7;
  }

  footer {
    text-align: center;
    padding: 15px;
    background-color: #E3F2FD;
    color: #1565C0;
    font-weight: bold;
  }
</style>
</head>
